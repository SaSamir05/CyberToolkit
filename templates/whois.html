{% extends "base.html" %}
{% block title %}WHOIS Lookup — CyberToolkit{% endblock %}
{% block content %}
<nav aria-label="breadcrumb"><ol class="breadcrumb">
  <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Home</a></li>
  <li class="breadcrumb-item active">WHOIS</li>
</ol></nav>

<div class="page-header mb-4">
  <h2><i class="bi bi-globe2 text-accent"></i> WHOIS Lookup</h2>
  <p class="text-muted mb-0">Registrar, dates, nameservers, and DNS information.</p>
</div>

<div class="glass-card p-4 mb-4">
  <div class="d-flex gap-2 flex-wrap">
    <input id="wh-domain" class="form-control flex-grow-1" placeholder="example.com" style="min-width:250px">
    <button id="wh-run" class="btn btn-accent"><i class="bi bi-search"></i> Lookup</button>
  </div>
</div>

<div class="glass-card p-4">
  <div id="wh-results" class="empty-state"><i class="bi bi-globe2"></i><p>WHOIS results will appear here.</p></div>
</div>
{% endblock %}
{% block scripts %}<script>
document.getElementById('wh-run').addEventListener('click', async () => {
  const domain = document.getElementById('wh-domain').value.trim();
  if (!domain) return CT.toast('Enter a domain', 'warning');
  const container = document.getElementById('wh-results');
  container.classList.add('empty-state');
  container.innerHTML = '<div class="spinner-border text-accent"></div><p>Looking up…</p>';
  const r = await CT.api('/whois/api', { domain });
  if (!r.ok) { container.innerHTML = `<i class="bi bi-x-circle"></i><p>${r.error}</p>`; return; }
  container.classList.remove('empty-state');
  const res = r.result;
  const rows = [
    ['Domain', res.domain], ['Registrar', res.registrar], ['Organization', res.org],
    ['Country', res.country], ['Created', res.creation_date], ['Updated', res.updated_date],
    ['Expires', res.expiration_date], ['DNSSEC', res.dnssec],
    ['Status', Array.isArray(res.status) ? res.status.join('<br>') : res.status],
    ['Name servers', Array.isArray(res.name_servers) ? res.name_servers.join('<br>') : res.name_servers],
    ['Emails', Array.isArray(res.emails) ? res.emails.join('<br>') : res.emails],
  ];
  container.innerHTML = `<div class="table-responsive"><table class="table table-dark table-hover align-middle mb-0">
    <tbody>${rows.map(([k,v]) => `<tr><th class="text-muted" style="width:200px">${k}</th><td>${v ?? '<span class="text-muted">—</span>'}</td></tr>`).join('')}</tbody>
  </table></div>`;
});
</script>{% endblock %}
