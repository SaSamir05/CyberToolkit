<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Cybersecurity Toolkit{% endblock %}</title>
  <meta name="description" content="Professional security utilities for ethical hackers and security engineers." />
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/animations.css') }}" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top glass-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
        <span class="brand-logo"><i class="bi bi-shield-lock-fill"></i></span>
        <span class="fw-bold">Cyber<span class="text-accent">Toolkit</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-house"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('hash.page') }}"><i class="bi bi-hash"></i> Hash</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('base64.page') }}"><i class="bi bi-code-slash"></i> Base64</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('password.page') }}"><i class="bi bi-key"></i> Password</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('scanner.page') }}"><i class="bi bi-radar"></i> Scanner</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('whois.page') }}"><i class="bi bi-globe2"></i> WHOIS</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}"><i class="bi bi-info-circle"></i> About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-lg-5 py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer text-center py-4 mt-5">
    <div class="container">
      <p class="mb-1 small text-muted">
        <i class="bi bi-shield-check text-accent"></i>
        Cybersecurity Toolkit &middot; For educational and authorized security testing only.
      </p>
      <p class="mb-0 small text-muted">&copy; 2026 CyberToolkit. All rights reserved.</p>
    </div>
  </footer>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
